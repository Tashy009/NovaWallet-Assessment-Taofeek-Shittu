name: novawallet

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novawallet
      POSTGRES_USER: novawallet
      # Local-demo credential only. Override via a .env file or the shell; never reuse outside local development.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novawallet_dev_only}
    ports:
      - "5433:5432"   # 5433 on the host avoids clashing with a locally installed PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novawallet -d novawallet"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/NovaWallet.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Ledger: "Host=postgres;Port=5432;Database=novawallet;Username=novawallet;Password=${POSTGRES_PASSWORD:-novawallet_dev_only};Maximum Pool Size=50"
      Database__RunMigrationsOnStartup: "true"
      Swagger__Enabled: "true"
      # Local-demo signing key only; supply JWT_SIGNING_KEY from a secret store anywhere else.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-demo-only-signing-key-change-me-0123456789}
      DevAuth__Enabled: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
